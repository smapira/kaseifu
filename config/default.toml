# Built-in application defaults (documentation).
#
# This file is NOT read at runtime: the effective defaults live in
# src/config/defaults.rs, and user overrides go to
# ~/Library/Application Support/kaseifu/config.toml (`kaseifu config set`).
# It mirrors those defaults and nothing else.
#
# The `[scanner]`, `[context]` and `[storage]` sections were removed: no
# code ever read them, and the `[storage] database` path named a file the
# journal never used. The journal lives at
# ~/Library/Application Support/kaseifu/kaseifu.db (`kaseifu doctor` shows it).

# Rename response language (BCP47 tag). Changed with
# `kaseifu config set language <tag>`; the default is English.
language = "en"

[classifier]
provider = "jev"

[classifier.thresholds]
auto_move_confidence = 0.85
auto_move_margin = 0.40
review_confidence = 0.60

[operations]
# Accepted for compatibility only (existing user TOML files must keep
# loading) and inactive: moves are controlled by `--execute`, and every
# executed move is journaled so it can be undone. `kaseifu config show`
# marks both keys as inactive.
dry_run = true
enable_undo = true

[metadata.image]
enabled = true
spotlight = true
exif_fallback = true

[metadata.privacy]
send_capture_time_to_jev = true
send_gps_to_jev = false

[metadata.weather]
enabled = false
