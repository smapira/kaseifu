name: Homebrew acceptance

# The project builds a Swift bridge against Foundation Models and reads
# Spotlight, so it is macOS only: a Linux container cannot run this. The
# isolated acceptance run therefore uses a disposable macOS runner, which has
# Xcode and no prior rust/llvm, instead of a container.
#
# It checks the tap the way a user installs it: tap, trust, install, run, and
# the formula's own test. No secrets are needed.

on:
  workflow_dispatch:
  schedule:
    # Weekly: catches tap drift (a broken formula, a vanished tag archive)
    # without anyone asking for it.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  install-from-tap:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Record the environment
        run: |
          {
            echo "homebrew=$(brew --version | head -1)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "macos=$(sw_vers -productVersion)"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "xcode_select=$(xcode-select -p)"
            echo "swiftc=$(xcrun --find swiftc)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The macro plugin that the Swift bridge needs ships only with
          # Xcode.app (measured: a Command Line Tools selection fails the
          # build), so the selection is recorded above and checked here.
          ls /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/usr/lib/swift/host/plugins/ 2>/dev/null \
            | grep -c FoundationModelsMacros | sed 's/^/xcode_macro_plugin_files=/' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Make sure Xcode itself is selected
        run: |
          # Homebrew only checks that Xcode is installed; the build needs the
          # Xcode developer directory to be the selected one.
          if xcode-select -p | grep -q '^/Applications/Xcode.*\.app/'; then
            echo "Xcode is already selected: $(xcode-select -p)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
            echo "selecting $xcode (was: $(xcode-select -p))" | tee -a "$GITHUB_STEP_SUMMARY"
            sudo xcode-select -s "$xcode"
            xcode-select -p
          fi

      - name: Tap and trust the formula
        run: |
          brew tap routeflags/tap
          brew trust --formula routeflags/tap/kaseifu

      - name: Install from the tap (source build, the user path)
        run: |
          start=$(date +%s)
          brew install kaseifu
          echo "install_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The installed version matches the formula
        run: |
          expected=$(brew info --json=v2 routeflags/tap/kaseifu | jq -r '.formulae[0].versions.stable')
          actual=$(kaseifu --version | awk '{print $2}')
          echo "formula=$expected installed=$actual" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$expected" = "$actual"
          test "$(kaseifu-bench --version | awk '{print $2}')" = "$actual"

      - name: Run the formula test
        run: brew test routeflags/tap/kaseifu

      - name: Record the dependency footprint
        if: always()
        run: |
          {
            echo '### Build dependencies the tap pulled in'
            brew list --versions rust llvm openssl@4 2>/dev/null || echo "(none of rust/llvm/openssl@4 listed)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
