[package]
name = "kaseifu"
version = "0.1.0"
edition = "2024"
description = "Semantic file organizer for macOS — uses Spotlight, filesystem context, and Jev to decide where files belong."
license = "MIT"
repository = "https://github.com/smapira/kaseifu"
homepage = "https://github.com/smapira/kaseifu"
keywords = ["file-organization", "spotlight", "macos", "semantic", "cli"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"

[[bin]]
name = "kaseifu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
url = "2"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
notify = "8"
xattr = "1"
